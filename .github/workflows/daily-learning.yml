name: Daily engineering log

on:
  workflow_dispatch:
    inputs:
      force:
        description: Replace today's existing note
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "37 22 * * *"
      timezone: "Asia/Jakarta"

permissions:
  contents: write

concurrency:
  group: daily-engineering-log-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate daily study brief
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          arguments=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            arguments+=(--force)
          fi
          python -m scripts.generate_daily_note "${arguments[@]}"

      - name: Validate generated files
        run: python -m scripts.validate_repository

      - name: Commit and push generated files
        env:
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
        run: |
          if [ -z "$GIT_AUTHOR_NAME" ] || [ -z "$GIT_AUTHOR_EMAIL" ]; then
            echo "GIT_AUTHOR_NAME and GIT_AUTHOR_EMAIL repository variables are required."
            exit 1
          fi

          git config --local user.name "$GIT_AUTHOR_NAME"
          git config --local user.email "$GIT_AUTHOR_EMAIL"
          git add README.md data/progress.json notes reports

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          log_date=$(TZ=Asia/Jakarta date +%F)
          git commit \
            -m "docs(log): add daily study brief ${log_date}" \
            -m "Generated-by: GitHub Actions and OpenRouter"
          git pull --rebase origin main
          git push origin HEAD:main
